# MT-Studio L2 project profile (plugin: MT-Studio-Plugin, rules L0 there). Names only — no secret values.
version: 1
project:
  name: P6 Vehicle Contact
  repo: idev006/MT-Agency-Super-App-Framework
  app_dir: apps/vehicle-contact
  default_branch: main
rules_extra:
  - "PDPA: do not block or caveat development on PDPA; legal writes consent at go-live (owner 2026-11-26). Synthetic DEV data still applies."
  - "Before go-live: switch off the system reset (P6VC_SYSTEM_RESET=ENABLED on the test system)."
context:
  generated:
    - apps/vehicle-contact/docs/generated/DATA_ACCESS_MAP.md
    - apps/vehicle-contact/docs/generated/CHANGE_CHECKLIST.md
  generator: { write: "node scripts/gen-system-maps.mjs", check: "node scripts/gen-system-maps.mjs --check" }
  decisions: apps/vehicle-contact/docs/DECISION_LOG.md
  decision_prefix: VC-ADR-
  use_cases: apps/vehicle-contact/docs/use-cases/   # validated by scripts/validate-usecase-ssot.mjs
commands:
  - { dir: apps/vehicle-contact/backend/gas, run: "npm run check:summary", what: "backend build + all tests" }
  - { dir: apps/vehicle-contact/frontend, run: "npm run test:summary", what: "frontend unit" }
  - { dir: apps/vehicle-contact/frontend, run: "npm run test:e2e:summary", what: "frontend e2e (mock API)" }
  - { dir: ., run: "node scripts/validate-ssot.mjs && node scripts/validate-usecase-ssot.mjs", what: "SSOT validators (CI)" }
  - { dir: ., run: "node --test tools/p6vc-api-test-console/worker.test.mjs", what: "Worker tests (CI)" }
versioning:
  files:
    - apps/vehicle-contact/backend/gas/package.json
    - apps/vehicle-contact/backend/gas/src/api/groups/system/SystemGroup.js
    - apps/vehicle-contact/backend/gas/scripts/expected-live-version.json   # the deploy smoke asserts this
    - apps/vehicle-contact/frontend/package.json                            # frontend version (FE)
deploy:
  on_merge:
    - "GitHub Pages: workflow 'Build and deploy Pages from SSOT' runs on every push to main (also docs-only PRs)"
  by_path:
    - { path: apps/vehicle-contact/contracts/firestore-indexes.v1.json, steps: [indexes] }
    - { path: apps/vehicle-contact/backend/gas/src, steps: [gas_push, gas_pin, cloudrun] }
    - { path: apps/vehicle-contact/backend/cloudrun, steps: [cloudrun, core] }   # shared handler: both services
    - { path: apps/vehicle-contact/backend/core, steps: [core] }
    - { path: apps/vehicle-contact/frontend/src, steps: [] }   # Pages on merge
    - { path: tools/p6vc-api-test-console, steps: [worker] }
  steps:
    - { id: indexes, run: "node scripts/ensure-firestore-indexes.mjs --apply (in apps/vehicle-contact/backend/gas)", verify: "report: declared N / live N / missing 0", note: "ALWAYS before the backend" }
    - { id: gas_push, run: "gh workflow run deploy-vehicle-gas.yml --ref main -f confirmation=PUSH_VEHICLE_GAS",
        confirmation: PUSH_VEHICLE_GAS, verify: "run log: 'Created version N'", note: "push + version only; does not publish the web app" }
    - { id: gas_pin, run: "npx @google/clasp@3.4.1 -u p6vc update-deployment <id from MEDIA_BRIDGE_URL in deploy-vehicle-cloudrun.yml> -V N",
        verify: "clasp list-deployments shows @N", note: "run from apps/vehicle-contact/backend/gas" }
    - { id: cloudrun, run: "gh workflow run deploy-vehicle-cloudrun.yml --ref main -f confirmation=DEPLOY_VEHICLE_CLOUDRUN",
        confirmation: DEPLOY_VEHICLE_CLOUDRUN, verify: "steps 'Smoke the candidate' and 'Smoke the live URL' success", note: "safe deploy: no traffic → smoke → switch → smoke, auto rollback" }
    - { id: core, run: "gh workflow run deploy-vehicle-core.yml --ref main -f confirmation=DEPLOY_VEHICLE_CORE",
        confirmation: DEPLOY_VEHICLE_CORE, verify: "step 'Smoke the live URL' success (first run creates p6vc-core)", note: "VC-ADR-046 front door; after the legacy deploy when both change" }
    - { id: worker, run: "npx wrangler@4 deploy (in tools/p6vc-api-test-console)", note: "separate deploy; the live API suite does NOT go through it" }
  rollback:
    - "Cloud Run: workflow rollback-vehicle-cloudrun.yml, confirmation ROLLBACK_VEHICLE_CLOUDRUN"
    - "GAS web app: clasp -u p6vc update-deployment <id> -V <previous>"
    - "Runbook: apps/vehicle-contact/docs/CLOUD_RUN_RELEASE_AND_ROLLBACK_RUNBOOK.md"
prove:
  version_check: "deploy smoke compares backendVersion with expected-live-version.json"
  live_suite:
    dir: apps/vehicle-contact/backend/gas
    command: "node scripts/run-live-api-suite.mjs --require-authenticated --require-data-proof"
    gates: [P6VC_ALLOW_FIRESTORE_DEV_PROBE=RUN_SYNTHETIC_FIRESTORE_PROBE]
    background: true            # > 10 minutes
    expect: "LIVE_SUITE status PASS 112/112 (public 11, Worker 14, authenticated 80 covering every op, DATA_PROOF 7)"
  data_proof:
    dir: .
    command: "P6VC_ALLOW_FIRESTORE_DEV_PROBE=RUN_SYNTHETIC_FIRESTORE_PROBE node apps/vehicle-contact/backend/gas/scripts/firestore-readback-proof.mjs"
    freshness: "proof startedAt >= suite startedAt (test-results/p6vc-live-api-suite.json)"
  ui_checks:
    - { needs: "preview_start p6vc-frontend (port 5173)", run: "P6VC_ALLOW_OWNER_DEV_WRITES=RUN_SYNTHETIC_OWNER_DEV node scripts/live-settings-ui.mjs", dir: apps/vehicle-contact/frontend }
    - { needs: "preview_start p6vc-frontend (port 5173)", run: "P6VC_ALLOW_OWNER_DEV_WRITES=RUN_SYNTHETIC_OWNER_DEV node scripts/live-print-ui.mjs", dir: apps/vehicle-contact/frontend }
  readback: "@google-cloud/firestore from backend/gas node_modules; env NAMES from gitignored .env: GOOGLE_APPLICATION_CREDENTIALS, FIRESTORE_PROJECT_ID, FIRESTORE_DATABASE_ID (load via backend/gas/scripts/load-env.mjs)"
gotchas:
  - "2026-11-26 DATA_PROOF is BLOCKED (suite FAIL) unless the probe gate env is set for the suite run."
  - "2026-11-26 gen-system-maps finds store rules by 'export function <name>' in any application module; moving one needs the generator rule checked."
  - "2026-11-26 internal error codes (INVALID_SETTINGS, INVALID_SETTING_VALUE) surface as public INVALID_REQUEST; compare tests with the old code first."
  - "2026-11-26 LSP needs jsconfig.json in backend/gas and frontend for cross-file definition/references (.vue not covered)."
