name: Roll back P6 Vehicle Contact API on Cloud Run (manual only)

# VC-ADR-041: one click moves ALL traffic back to an earlier revision (seconds; no rebuild). Cloud Run keeps old revisions.
# Default target: the newest READY revision created before the one serving now. Or name one (Cloud Run console → Revisions).
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ROLLBACK_VEHICLE_CLOUDRUN to move traffic to an earlier revision'
        required: true
        type: string
      revision:
        description: 'Revision name (empty = the one before the current)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-p6-vehicle-cloudrun
  cancel-in-progress: false

env:
  PROJECT_ID: mt-iam-core-2026
  REGION: asia-southeast3
  SERVICE: p6vc-api

jobs:
  rollback:
    name: Move traffic to an earlier revision
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'ROLLBACK_VEHICLE_CLOUDRUN'
    timeout-minutes: 10
    steps:
      - name: Checkout (smoke script)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Choose the target revision
        id: target
        env:
          WANT: ${{ inputs.revision }}
        run: |
          CUR=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -r '[.status.traffic[] | select((.percent // 0) == 100)][0].revisionName')
          LIST=$(gcloud run revisions list --service "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)
          if [ -n "$WANT" ]; then
            if ! [[ "$WANT" =~ ^p6vc-api-[a-z0-9-]+$ ]]; then echo "::error::bad revision name"; exit 1; fi
            TARGET=$(echo "$LIST" | jq -r --arg w "$WANT" '.[] | select(.metadata.name == $w) | .metadata.name')
          else
            CTS=$(echo "$LIST" | jq -r --arg c "$CUR" '.[] | select(.metadata.name == $c) | .metadata.creationTimestamp')
            TARGET=$(echo "$LIST" | jq -r --arg c "$CUR" --arg cts "$CTS" '[.[]
              | select(.metadata.name != $c and .metadata.creationTimestamp < $cts)
              | select(any(.status.conditions[]; .type == "Ready" and .status == "True"))]
              | sort_by(.metadata.creationTimestamp) | reverse | .[0].metadata.name // empty')
          fi
          if [ -z "$TARGET" ]; then echo "::error::no target revision found"; exit 1; fi
          echo "Serving: $CUR -> rolling back to: $TARGET"
          echo "revision=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Move traffic
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "${{ steps.target.outputs.revision }}=100" --quiet

      - name: Smoke the live URL
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          node apps/vehicle-contact/backend/cloudrun/candidate-smoke.mjs "$URL" --any-version
