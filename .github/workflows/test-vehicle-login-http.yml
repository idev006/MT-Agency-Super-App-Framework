name: P6VC Single-Account HTTP Login Acceptance (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type TEST_LOGIN_ON_APPROVED_SHEET to permit test-only auth/session writes'
        type: string
        required: true

permissions:
  contents: read

jobs:
  login-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Authorize exact owner, main branch and explicit confirmation
        env:
          P6VC_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" != "idev006" ]; then
            echo "DENIED: only the repository owner may dispatch this privileged account test"; exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "DENIED: only main may run this test"; exit 1
          fi
          if [ "$P6VC_CONFIRMATION" != "TEST_LOGIN_ON_APPROVED_SHEET" ]; then
            echo "DENIED: explicit owner test confirmation required"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auth-only real HTTPS test against fixed owner-approved GAS target
        env:
          P6VC_GAS_EXEC_URL: 'https://script.google.com/macros/s/AKfycby15c-Aux2za0BuedeIYni8-tc6rkf9ZVNmw-6ZMTgPvG9SvFjuQVSzNoMouiMhqTmxrA/exec'
          P6VC_HTTP_LOGIN_USERNAME: 'admin'
          P6VC_HTTP_LOGIN_PASSWORD: ${{ secrets.P6VC_HTTP_LOGIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$P6VC_HTTP_LOGIN_PASSWORD" ]; then
            echo 'BLOCKED: repository secret P6VC_HTTP_LOGIN_PASSWORD is missing'; exit 1
          fi
          node apps/vehicle-contact/backend/gas/scripts/login-http-acceptance.mjs
