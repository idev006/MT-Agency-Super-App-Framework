name: Validate P6VC Cloudflare API Test Console
on:
  push:
    branches:
      - feat/p6vc-cloudflare-api-test-console-poc-20261118
    paths:
      - 'tools/p6vc-api-test-console/**'
      - '.github/workflows/validate-p6vc-api-test-console.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker and isolated test syntax
        run: |
          node --check tools/p6vc-api-test-console/worker.mjs
          node --check tools/p6vc-api-test-console/worker.test.mjs
      - name: Run mocked Cloudflare Worker contract/security tests
        run: node --test tools/p6vc-api-test-console/worker.test.mjs
