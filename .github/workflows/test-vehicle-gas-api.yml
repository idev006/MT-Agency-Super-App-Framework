name: Test P6 Vehicle Contact Live GAS API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6vc-live-api-smoke
  cancel-in-progress: false

jobs:
  live-api-smoke:
    name: Live HTTP GET/POST public health and default-deny checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      P6VC_GAS_EXEC_URL: 'https://script.google.com/macros/s/AKfycby15c-Aux2za0BuedeIYni8-tc6rkf9ZVNmw-6ZMTgPvG9SvFjuQVSzNoMouiMhqTmxrA/exec'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Live API HTTP smoke and default-deny checks
        run: node apps/vehicle-contact/backend/gas/scripts/smoke-api.mjs
      - name: Record scope and exclusions
        if: always()
        run: |
          echo "### P6 Vehicle Contact GAS API safe live HTTP smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: owner-supplied existing public /exec URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- 11 GET/POST cases; no real credentials, PII, vehicle data, QR tokens or media submitted." >> "$GITHUB_STEP_SUMMARY"
          echo "- Protected API requests intentionally malformed to avoid business/Sheets writes even if feature flag is accidentally enabled." >> "$GITHUB_STEP_SUMMARY"
          echo "- Live health/deny responses do NOT prove authenticated API, Sheets persistence, RBAC, PDPA or deployment version." >> "$GITHUB_STEP_SUMMARY"
