name: Validate P6 Vehicle Contact

on:
  pull_request:
    paths:
      - 'apps/vehicle-contact/**'
      - 'tools/p6vc-api-test-console/**'
      - 'scripts/**'
      - 'blueprint/**'
      - 'portal/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-p6vc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: SSOT, frontend, Worker and GAS contracts
    # Playwright 1.56 ships Chromium for Ubuntu 24.04 (not 26.04): pinned so the E2E step can install it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/vehicle-contact/frontend/package-lock.json
      - name: Validate repository and use-case SSOT
        run: |
          node --check scripts/build-pages.mjs
          node --check scripts/validate-ssot.mjs
          node --check scripts/validate-usecase-ssot.mjs
          node scripts/validate-ssot.mjs
          node scripts/validate-usecase-ssot.mjs
          # generated system maps must match the code (regenerate: node scripts/gen-system-maps.mjs)
          node scripts/gen-system-maps.mjs --check
      - name: Test and build frontend for GitHub Pages
        working-directory: apps/vehicle-contact/frontend
        env:
          VITE_BASE_PATH: /MT-Agency-Super-App-Framework/apps/vehicle-contact/frontend/
        run: |
          npm ci
          npm test
          VITE_CORE_API_URL="$(node ../../../scripts/print-core-frontend-url.mjs)" npm run build
      - name: Frontend E2E (real browser, mocked API, desktop + phone)
        working-directory: apps/vehicle-contact/frontend
        env:
          CI: 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p6vc-e2e-report
          path: |
            apps/vehicle-contact/frontend/e2e-report
            apps/vehicle-contact/frontend/e2e-results
          retention-days: 7
      - name: Test Cloudflare gateway contract and security boundaries
        run: |
          node --check tools/p6vc-api-test-console/worker.mjs
          node --check tools/p6vc-api-test-console/worker.test.mjs
          node --check tools/p6vc-api-test-console/verify-live-worker-failclosed.mjs
          node --test tools/p6vc-api-test-console/worker.test.mjs
      - name: Test Node core (VC-ADR-046)
        working-directory: apps/vehicle-contact/backend/core
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Build and test GAS backend artifact
        working-directory: apps/vehicle-contact/backend/gas
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Verify generated GAS artifact
        working-directory: apps/vehicle-contact/backend/gas
        run: |
          test -s dist/appsscript.json
          expected_gs=$(( $(find src -type f -name '*.js' | wc -l) + 1 ))
          actual_gs=$(find dist -maxdepth 1 -type f -name '*.gs' | wc -l)
          test "$actual_gs" -eq "$expected_gs"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "$((expected_gs + 1))"
          test -s 'dist/ENTRYPOINTS$WebApp.gs'
          test -s 'dist/API$routes$Router.gs'
          test -s 'dist/INFRASTRUCTURE$persistence$firestore$FirestoreStore.gs'
          find dist -maxdepth 1 -type f -name '*.gs' -print0 | while IFS= read -r -d '' file; do
            test -s "$file"
            test "$(wc -l < "$file")" -le 800
          done

