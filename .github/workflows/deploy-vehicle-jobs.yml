name: Deploy P6 Vehicle Contact core jobs (Cloud Run Jobs, manual only)

# VC-ADR-046 phase 2c-2: scheduled work of the Node core runs as Cloud Run Jobs from the SAME image the live p6vc-core
# service runs (one image; deploy the core first when its code changed). Today: drive-photo-housekeeping (shared flow, photo bridge ops list +
# trash; Drive trash only, 30-day undo). Safe by default:
#   mode DRY_RUN (default) = report only; APPLY needs the extra phrase APPLY_DRIVE_HOUSEKEEPING.
#   schedule=false (default) = no Cloud Scheduler trigger; true = daily 03:30 Asia/Bangkok.
# Every run executes the job once and prints its JOB line (counters + short id prefixes only).
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_VEHICLE_JOBS to authorize deploying the core jobs'
        required: true
        type: string
      mode:
        description: 'DRY_RUN (report only) or APPLY (trash files / remove expired staging rows)'
        required: true
        default: DRY_RUN
        type: choice
        options: [DRY_RUN, APPLY]
      apply_confirmation:
        description: 'With mode APPLY only: type APPLY_DRIVE_HOUSEKEEPING'
        required: false
        type: string
      schedule:
        description: 'Create / update the daily Cloud Scheduler trigger (03:30 Asia/Bangkok)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-p6-vehicle-jobs
  cancel-in-progress: false

env:
  PROJECT_ID: mt-iam-core-2026
  REGION: asia-southeast3
  CORE_SERVICE: p6vc-core
  JOB: p6vc-housekeeping
  SCHEDULE_NAME: p6vc-housekeeping-daily
  RUNTIME_SA: p6vc-api-runtime@mt-iam-core-2026.iam.gserviceaccount.com

jobs:
  deploy:
    name: Deploy job, run once, optional schedule
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_VEHICLE_JOBS' &&
      (inputs.mode == 'DRY_RUN' || inputs.apply_confirmation == 'APPLY_DRIVE_HOUSEKEEPING')
    timeout-minutes: 30
    steps:
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: The image the live core service runs (built and smoked by deploy-vehicle-core)
        id: image
        run: |
          IMAGE=$(gcloud run services describe "$CORE_SERVICE" --project "$PROJECT_ID" --region "$REGION"             --format='value(spec.template.spec.containers[0].image)')
          if [ -z "$IMAGE" ]; then echo "::error::p6vc-core is not deployed — run deploy-vehicle-core first"; exit 1; fi
          echo "Image: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy the job (${{ inputs.mode }})
        run: |
          gcloud run jobs deploy "$JOB" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${{ steps.image.outputs.image }}" \
            --service-account "$RUNTIME_SA" \
            --command node --args "backend/core/src/job.mjs,drive-photo-housekeeping" \
            --tasks 1 --max-retries 0 --task-timeout 900 --cpu 1 --memory 512Mi \
            --set-env-vars "FIRESTORE_PROJECT_ID=${PROJECT_ID},FIRESTORE_DATABASE_ID=(default),P6VC_JOB_MODE=${{ inputs.mode }}" \
            --set-secrets "P6VC_MEDIA_BRIDGE_SECRET=p6vc-media-bridge-secret:latest" \
            --labels "app=p6vc,component=core-job,commit=${GITHUB_SHA::12}" \
            --quiet

      - name: Run once and read its report
        run: |
          EXEC=$(gcloud run jobs execute "$JOB" --project "$PROJECT_ID" --region "$REGION" --wait --format='value(metadata.name)') && RC=0 || RC=$?
          echo "Execution: ${EXEC:-unknown} (exit $RC)"
          sleep 20 # log ingestion
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB} AND labels.\"run.googleapis.com/execution_name\"=${EXEC} AND textPayload:\"JOB \"" \
            --project "$PROJECT_ID" --limit 5 --format='value(textPayload)' || echo "::warning::could not read the job log"
          exit $RC

      - name: Daily trigger (Cloud Scheduler)
        if: inputs.schedule
        run: |
          # the trigger calls the job as the runtime account, which may only run this job
          gcloud run jobs add-iam-policy-binding "$JOB" --project "$PROJECT_ID" --region "$REGION"             --member "serviceAccount:${RUNTIME_SA}" --role roles/run.invoker --quiet >/dev/null
          URI="https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/jobs/${JOB}:run"
          ARGS=(--project "$PROJECT_ID" --location "$REGION" --schedule "30 3 * * *" --time-zone "Asia/Bangkok"
            --uri "$URI" --http-method POST --oauth-service-account-email "$RUNTIME_SA")
          if gcloud scheduler jobs describe "$SCHEDULE_NAME" --project "$PROJECT_ID" --location "$REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$SCHEDULE_NAME" "${ARGS[@]}" --quiet
          else
            gcloud scheduler jobs create http "$SCHEDULE_NAME" "${ARGS[@]}" --quiet
          fi
          gcloud scheduler jobs describe "$SCHEDULE_NAME" --project "$PROJECT_ID" --location "$REGION" --format='value(schedule,timeZone,state)'
