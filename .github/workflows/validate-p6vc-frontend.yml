name: Validate P6VC Frontend POC
on:
  pull_request:
    paths:
      - 'apps/vehicle-contact/frontend/**'
      - 'apps/vehicle-contact/docs/FRONTEND_*'
      - 'tools/p6vc-api-test-console/**'
      - '.github/workflows/validate-p6vc-frontend.yml'
  push:
    branches:
      - feat/p6vc-cloudflare-api-test-console-poc-20261118
    paths:
      - 'apps/vehicle-contact/frontend/**'
      - 'apps/vehicle-contact/docs/FRONTEND_*'
      - 'tools/p6vc-api-test-console/**'
      - '.github/workflows/validate-p6vc-frontend.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/vehicle-contact/frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: apps/vehicle-contact/frontend
        run: npm ci
      - name: Run frontend unit and component contract tests
        working-directory: apps/vehicle-contact/frontend
        run: npm test
      - name: Build GitHub Pages artifact
        working-directory: apps/vehicle-contact/frontend
        env:
          VITE_BASE_PATH: /MT-Agency-Super-App-Framework/apps/vehicle-contact/frontend/
        run: npm run build
      - name: Run Cloudflare gateway contract tests
        run: node --test tools/p6vc-api-test-console/worker.test.mjs
