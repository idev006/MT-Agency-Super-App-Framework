name: Deploy P6 Vehicle Contact Node core to Cloud Run (manual only)

# VC-ADR-046: new service p6vc-core = the front door; it forwards every operation it has not ported yet to the legacy
# service p6vc-api. Same safe deploy as VC-ADR-041 (no traffic -> smoke candidate -> switch -> smoke live -> roll back).
# The first run creates the service (there is no previous revision to protect), then smokes it.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_VEHICLE_CORE to authorize deploying a new p6vc-core revision'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-p6-vehicle-core
  cancel-in-progress: false

env:
  PROJECT_ID: mt-iam-core-2026
  REGION: asia-southeast3
  SERVICE: p6vc-core
  REPOSITORY: p6vc
  RUNTIME_SA: p6vc-api-runtime@mt-iam-core-2026.iam.gserviceaccount.com
  # ONE number for the core's CPU: --cpu and the libuv thread pool (UV_THREADPOOL_SIZE = 2 x vCPU) follow it together.
  CORE_CPU: 2

jobs:
  deploy:
    name: Test, build image, deploy revision
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_VEHICLE_CORE'
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source from main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Core tests (+ the backend gate the core imports)
        run: |
          (cd apps/vehicle-contact/backend/gas && npm install --no-audit --no-fund && npm run check)
          (cd apps/vehicle-contact/backend/core && npm ci --no-audit --no-fund && npm test)

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        id: image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f apps/vehicle-contact/backend/core/Dockerfile -t "$IMAGE" apps/vehicle-contact
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Remember the revision serving now (empty on the first deploy)
        id: prev
        run: |
          if DESC=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json 2>/dev/null); then
            PREV=$(echo "$DESC" | jq -r '[.status.traffic[] | select((.percent // 0) == 100)][0].revisionName // empty')
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            PREV=""
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Serving now: ${PREV:-none (first deploy)}"
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"

      - name: Deploy revision (no traffic when the service already exists)
        run: |
          # Async core: high concurrency is safe. Outbound URLs come from contracts/ (Integration Manager), not env.
          # 2 vCPU (VC-ADR-046 wave 1 load test): login hashing (node:crypto PBKDF2) runs in libuv's thread pool, so a second
          # core runs hashes in parallel with the event loop; on 1 vCPU the login p50 grew with every concurrent login.
          # The pool needs >= one thread per vCPU (measured: 100 hashes 2,315 ms with 2 threads vs 1,346 ms with 4).
          # 512Mi: gRPC + concurrent hashing headroom (RSS peak measured 131 MB at 80 lookups in flight).
          NO_TRAFFIC=""
          if [ "${{ steps.prev.outputs.exists }}" = "true" ]; then NO_TRAFFIC="--no-traffic --tag candidate"; fi
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${{ steps.image.outputs.image }}" \
            --service-account "$RUNTIME_SA" \
            --concurrency 80 --min-instances 0 --max-instances 5 \
            --cpu "$CORE_CPU" --memory 512Mi --timeout 60 --cpu-boost \
            --allow-unauthenticated \
            --set-env-vars "FIRESTORE_PROJECT_ID=${PROJECT_ID},FIRESTORE_DATABASE_ID=(default),UV_THREADPOOL_SIZE=$((CORE_CPU * 2))" \
            --set-secrets "P6VC_MEDIA_BRIDGE_SECRET=p6vc-media-bridge-secret:latest" \
            --labels "app=p6vc,component=core,commit=${GITHUB_SHA::12}" \
            $NO_TRAFFIC --quiet

      - name: Smoke the candidate (no user traffic yet)
        id: candidate
        if: steps.prev.outputs.exists == 'true'
        run: |
          DESC=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json)
          NEW=$(echo "$DESC" | jq -r '.status.latestCreatedRevisionName')
          CAND=$(echo "$DESC" | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          echo "revision=$NEW" >> "$GITHUB_OUTPUT"
          echo "Candidate $NEW at $CAND"
          node apps/vehicle-contact/backend/cloudrun/candidate-smoke.mjs "$CAND"

      - name: Switch traffic to the candidate
        if: steps.prev.outputs.exists == 'true'
        run: |
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "${{ steps.candidate.outputs.revision }}=100" --quiet

      - name: Smoke the live URL; roll back on failure
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "Live URL: $URL"
          if node apps/vehicle-contact/backend/cloudrun/candidate-smoke.mjs "$URL"; then
            echo "LIVE OK"
          else
            PREV="${{ steps.prev.outputs.revision }}"
            if [ -n "$PREV" ]; then
              echo "::error::live smoke failed - moving traffic back to $PREV"
              gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "$PREV=100" --quiet
            else
              echo "::error::first deploy failed its smoke - the web app does not use p6vc-core yet, nothing to roll back"
            fi
            exit 1
          fi
