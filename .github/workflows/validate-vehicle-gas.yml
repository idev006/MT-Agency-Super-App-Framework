name: Validate Vehicle Contact GAS Backend
on:
  push:
    paths:
      - 'apps/vehicle-contact/backend/gas/**'
      - 'apps/vehicle-contact/schema/**'
      - 'apps/vehicle-contact/docs/GAS_*'
      - '.github/workflows/validate-vehicle-gas.yml'
  pull_request:
    paths:
      - 'apps/vehicle-contact/backend/gas/**'
      - 'apps/vehicle-contact/schema/**'
      - 'apps/vehicle-contact/docs/GAS_*'
      - '.github/workflows/validate-vehicle-gas.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vehicle-contact/backend/gas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Build Apps Script artifact
        run: npm run build
      - name: Source, adapter and bundled GAS contract tests
        run: npm test
      - name: Check generated GAS code and manifest
        run: |
          test -s dist/appsscript.json
          expected_gs=$(( $(find src -type f -name '*.js' | wc -l) + 1 ))
          actual_gs=$(find dist -maxdepth 1 -type f -name '*.gs' | wc -l)
          test "$actual_gs" -eq "$expected_gs"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq "$((expected_gs + 1))"
          echo "Verified $actual_gs generated GAS modules (sources + schema) and manifest"
          test -s 'dist/ENTRYPOINTS$WebApp.gs'
          test -s 'dist/API$routes$Router.gs'
          test -s 'dist/INFRASTRUCTURE$persistence$sheets$SheetsSchemaRepository.gs'
          find dist -maxdepth 1 -type f -name '*.gs' -print0 | while IFS= read -r -d '' file; do
            test -s "$file"
            test "$(wc -l < "$file")" -le 800
          done
