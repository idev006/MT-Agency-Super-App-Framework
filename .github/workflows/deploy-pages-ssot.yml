name: Build and deploy Pages from SSOT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-ssot
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts and canonical sources
        run: |
          node --check scripts/build-pages.mjs
          node --check scripts/validate-ssot.mjs
          node scripts/validate-ssot.mjs
      - name: Install and test Vehicle Contact frontend
        working-directory: apps/vehicle-contact/frontend
        run: |
          npm ci
          npm test
      - name: Build Vehicle Contact frontend for repository Pages path
        working-directory: apps/vehicle-contact/frontend
        env:
          VITE_BASE_PATH: /MT-Agency-Super-App-Framework/apps/vehicle-contact/frontend/
          VITE_WORKER_API_URL: https://p6vc-api-test-console.thaipoliceregion6.workers.dev/api/frontend
          VITE_GAS_API_URL: https://script.google.com/macros/s/AKfycby15c-Aux2za0BuedeIYni8-tc6rkf9ZVNmw-6ZMTgPvG9SvFjuQVSzNoMouiMhqTmxrA/exec
        run: npm run build
      - name: Build disposable Pages artifact
        run: node scripts/build-pages.mjs _site
      - name: Verify generated artifact against SSOT
        run: node scripts/validate-ssot.mjs --built _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
