name: Validate Repository SSOT
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          node --check scripts/build-pages.mjs
          node --check scripts/validate-ssot.mjs
          node --check scripts/validate-usecase-ssot.mjs
      - name: Validate sources
        run: |
          node scripts/validate-ssot.mjs
          node scripts/validate-usecase-ssot.mjs
      - name: Install and test Vehicle Contact frontend
        working-directory: apps/vehicle-contact/frontend
        run: |
          npm ci
          npm test
      - name: Build Vehicle Contact frontend for repository Pages path
        working-directory: apps/vehicle-contact/frontend
        env:
          VITE_BASE_PATH: /MT-Agency-Super-App-Framework/apps/vehicle-contact/frontend/
        run: npm run build
      - name: Build generated site
        run: node scripts/build-pages.mjs _site
      - name: Confirm published output matches SSOT
        run: node scripts/validate-ssot.mjs --built _site
